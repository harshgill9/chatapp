{% extends 'base.html' %}
{% block title %}Create Room{% endblock %}
{% block content %}

<div class="max-w-xl mx-auto mt-10 bg-white dark:bg-gray-800 shadow-md rounded-lg p-6">
  <h2 class="text-2xl font-semibold text-gray-800 dark:text-gray-100 mb-4">➕ Create Chat Room</h2>

  {% if messages %}
  <div class="space-y-2 mb-4">
    {% for message in messages %}
    <div class="px-4 py-2 rounded {{ message.tags }} bg-red-100 text-red-800">{{ message }}</div>
    {% endfor %}
  </div>
  {% endif %}

  <form method="POST" class="space-y-4">
    {% csrf_token %}
    <div>
      <label for="room_name" class="block text-gray-700 dark:text-gray-200 font-medium mb-1">Room Name</label>
      <input
        type="text"
        name="room_name"
        id="room_name"
        placeholder="Enter room name"
        required
        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400 dark:bg-gray-700 dark:border-gray-600 dark:text-white"
      />
    </div>

    <button
      type="submit"
      class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-md transition duration-200"
    >
      Create Room
    </button>
  </form>
</div>
{% endblock %}
