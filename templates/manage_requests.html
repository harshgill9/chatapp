{% extends 'base.html' %}

{% block content %}
<div class="max-w-xl mx-auto bg-white dark:bg-gray-900 p-6 rounded-lg shadow">
  <h2 class="text-xl font-bold mb-4">Pending Join Requests for {{ room.name }}</h2>

  {% if requests %}
    <ul class="space-y-3">
      {% for req in requests %}
        <li class="flex justify-between items-center border-b pb-2">
          <span>{{ req.user.username }}</span>
          <div class="flex gap-2">
            <a href="{% url 'handle_request_action' req.id 'accept' %}" class="px-3 py-1 bg-green-500 text-white rounded hover:bg-green-600">Accept</a>
            <a href="{% url 'handle_request_action' req.id 'reject' %}" class="px-3 py-1 bg-red-500 text-white rounded hover:bg-red-600">Reject</a>
          </div>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p class="text-gray-500">No pending requests right now.</p>
  {% endif %}
</div>
{% endblock %}
