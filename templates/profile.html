{% extends 'base.html' %}
{% block content %}

<div class="p-6 max-w-4xl mx-auto bg-white dark:bg-gray-800 rounded-lg shadow">

  <!-- Profile Picture and Update -->
  <div class="flex items-center space-x-6 mb-6">
    {% if profile.profile_pic %}
      <img src="{{ profile.profile_pic.url }}" alt="Profile Picture" class="w-24 h-24 rounded-full object-cover shadow">
    {% else %}
      <div class="w-24 h-24 rounded-full bg-gray-300 dark:bg-gray-700 flex items-center justify-center text-gray-700 dark:text-gray-300 text-3xl font-bold">
        {{ request.user.username|first|upper }}
      </div>
    {% endif %}
    <div>
      <a href="{% url 'update_profile' %}" class="text-indigo-600 dark:text-indigo-400 hover:underline font-semibold">
        ✏️ Change Profile Picture
      </a>
    </div>
  </div>

  <!-- Edit Profile Form -->
  <form action="{% url 'update_profile' %}" method="post" class="space-y-6">
    {% csrf_token %}

    <!-- Name -->
    <div>
      <label for="first_name" class="block text-gray-700 dark:text-gray-200 font-semibold mb-1">Name</label>
      <input
        type="text"
        id="first_name"
        name="first_name"
        value="{{ request.user.first_name }}"
        class="w-full px-4 py-2 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-500"
        required
      />
    </div>

    <!-- Phone Number -->
    <div>
      <label for="phone_number" class="block text-gray-700 dark:text-gray-200 font-semibold mb-1">Phone Number</label>
      <input
        type="tel"
        id="phone_number"
        name="phone_number"
        value="{{ profile.phone_number }}"
        placeholder="+91 xxxx xxx xxxx"
        class="w-full px-4 py-2 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-500"
      />
    </div>

    <!-- About Section -->
    <div>
      <label for="about" class="block text-gray-700 dark:text-gray-200 font-semibold mb-1">About</label>
      <textarea
        id="about"
        name="about"
        rows="4"
        placeholder="Tell us something about yourself..."
        class="w-full px-4 py-2 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-500"
      >{{ profile.about }}</textarea>
    </div>

    <!-- Save Button -->
    <div>
      <button
        type="submit"
        class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded font-semibold transition"
      >
        💾 Save Changes
      </button>
    </div>
  </form>

  <!-- Delete Account Button -->
  <form action="{% url 'delete_account_permanently' %}" method="post" class="mt-8">
    {% csrf_token %}
    <button type="submit" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">
      🗑️ Delete My Account
    </button>
  </form>

</div>

{% endblock %}
