{% extends 'base.html' %}
{% load static %}

{% block content_wrapper %}
   <div class="relative min-h-screen w-full overflow-hidden bg-cover bg-center bg-no-repeat"
       style="background-image: url('{% static 'img/Login-bg-img.jpg' %}');">

    <!-- Blur Overlay -->
    <div class="absolute inset-0 backdrop-blur-sm bg-black/40"></div>

    <!-- Login Box -->
    <div class="relative z-10 flex justify-center items-center h-screen">
      <div class="w-full max-w-md bg-white/90 dark:bg-gray-900/90 rounded-lg shadow-lg p-8 border border-gray-200 dark:border-gray-700">
        <h2 class="text-2xl font-bold text-center text-gray-800 dark:text-white mb-6">🔐 Login to Your Account</h2>

        <form method="post" class="space-y-4">
          {% csrf_token %}
          {% if messages %}
            <div class="space-y-2">
              {% for message in messages %}
                <div class="px-4 py-2 rounded {{ message.tags }} bg-red-100 text-red-800">{{ message }}</div>
              {% endfor %}
            </div>
          {% endif %}
          <input type="hidden" name="next" value="{{ next }}" />
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-200">Username</label>
            <input type="text" name="username" required placeholder="👤 Enter your username"
              class="mt-1 w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-800 dark:text-white" />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-200">Password</label>
            <input type="password" name="password" required placeholder="🔑 Enter your password"
              class="mt-1 w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-800 dark:text-white" />
          </div>

          <button type="submit"
            class="w-full bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700 transition duration-200">
            🔑 Login
          </button>
        </form>

        <p class="text-sm text-center text-gray-600 dark:text-gray-300 mt-4">
          Don't have an account?
          <a href="{% url 'signup' %}" class="text-blue-600 hover:underline">Sign up here</a>
        </p>
      </div>
    </div>
  </div>
{% endblock %}
